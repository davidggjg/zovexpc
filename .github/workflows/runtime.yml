name: Build runtime payload

# Heavy and slow, so it does not run on every push to the app. It runs when
# this workflow or the runtime manifest changes, and on demand.
on:
  push:
    paths:
      - ".github/workflows/runtime.yml"
      - "runtime/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  BOX64_REF: v0.3.4
  UBUNTU_RELEASE: "24.04"
  WINE_REF: wine-9.0

jobs:
  box64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake ninja-build python3

      - name: Fetch Box64
        run: |
          git clone --depth 1 --branch "$BOX64_REF" https://github.com/ptitSeb/box64.git box64-src
          echo "Box64 at $(git -C box64-src rev-parse HEAD)"

      # Built for aarch64 glibc, not for bionic: it runs inside the Linux
      # rootfs, where Wine's x86_64 binaries live. Upstream documents the
      # bionic build as experimental and unable to run Linux binaries, which
      # is exactly what we need it to do.
      - name: Configure and build
        run: |
          cmake -S box64-src -B box64-build -G Ninja \
            -DARM64=1 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64
          cmake --build box64-build --parallel

      - name: Check what came out
        run: |
          find box64-build -maxdepth 1 -type f -name 'box64*' -print
          file box64-build/box64
          # Must be an aarch64 ELF; anything else means the cross build
          # silently fell back to the host compiler.
          file box64-build/box64 | grep -q 'ARM aarch64' \
            || { echo "::error::box64 is not an aarch64 binary"; exit 1; }

      - name: Package
        run: |
          mkdir -p payload/box64/bin
          cp box64-build/box64 payload/box64/bin/
          cp box64-src/LICENSE payload/box64/ 2>/dev/null || true
          echo "$BOX64_REF" > payload/box64/VERSION
          (cd payload && zip -r ../box64-aarch64.zip box64)
          sha256sum box64-aarch64.zip | tee box64-aarch64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: box64-aarch64
          path: |
            box64-aarch64.zip
            box64-aarch64.zip.sha256
          if-no-files-found: error

  rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the Ubuntu base rootfs for arm64
        run: |
          base="https://cdimage.ubuntu.com/ubuntu-base/releases/${UBUNTU_RELEASE}/release"
          # The point release in the filename moves, so discover it rather
          # than pinning a name that silently 404s on the next respin.
          name=$(curl -fsSL "$base/" \
            | grep -o "ubuntu-base-${UBUNTU_RELEASE}[0-9.]*-base-arm64.tar.gz" \
            | sort -u | tail -1)
          test -n "$name" || { echo "::error::no arm64 base image found at $base"; exit 1; }
          echo "Using $name"
          curl -fsSL -o rootfs.tar.gz "$base/$name"
          curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
          grep " \*\?${name}\$" SHA256SUMS | sed "s|[*]\?${name}|rootfs.tar.gz|" | sha256sum -c -
          echo "ROOTFS_NAME=$name" >> "$GITHUB_ENV"

      - name: Report size
        run: |
          ls -lh rootfs.tar.gz
          tar -tzf rootfs.tar.gz | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-base-arm64
          path: rootfs.tar.gz
          if-no-files-found: error

  wine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ flex bison make pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxinerama-dev libxcomposite-dev libxfixes-dev libxrender-dev \
            libfreetype-dev libfontconfig1-dev libgl-dev libegl-dev \
            libvulkan-dev libasound2-dev libpulse-dev libudev-dev \
            libsdl2-dev libgnutls28-dev libxml2-dev libxslt1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libusb-1.0-0-dev libkrb5-dev libcups2-dev libdbus-1-dev \
            ocl-icd-opencl-dev libpcap-dev libsane-dev

      - name: Fetch Wine
        run: |
          git clone --depth 1 --branch "$WINE_REF" https://gitlab.winehq.org/wine/wine.git wine-src
          echo "Wine at $(git -C wine-src rev-parse HEAD)"

      # Built for x86_64 Linux on an x86_64 runner: no cross-compilation.
      # On the phone this is what Box64 translates, which is the whole point
      # of the rootfs path.
      - name: Configure
        run: |
          mkdir wine-build
          cd wine-build
          ../wine-src/configure \
            --enable-win64 \
            --prefix=/opt/wine \
            --disable-tests \
            --without-oss \
            --with-x \
            --with-vulkan \
            --with-freetype
          # configure warns rather than fails on missing optional parts, so
          # surface them instead of discovering the gap on the device.
          grep -A40 'you can still compile' config.log || true

      - name: Build
        run: make -C wine-build -j"$(nproc)"

      - name: Install into a staging tree
        run: |
          make -C wine-build install DESTDIR="$PWD/stage"
          du -sh stage/opt/wine
          file stage/opt/wine/bin/wine64 || file stage/opt/wine/bin/wine

      - name: Package
        run: |
          cp wine-src/LICENSE stage/opt/wine/ 2>/dev/null || true
          echo "$WINE_REF" > stage/opt/wine/VERSION
          (cd stage/opt && zip -qr "$GITHUB_WORKSPACE/wine-x86_64.zip" wine)
          sha256sum wine-x86_64.zip | tee wine-x86_64.zip.sha256
          ls -lh wine-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: wine-x86_64
          path: |
            wine-x86_64.zip
            wine-x86_64.zip.sha256
          if-no-files-found: error

  rootfs_x86:
    runs-on: ubuntu-latest
    needs: [wine]
    steps:
      - uses: actions/download-artifact@v4
        with: { name: wine-x86_64, path: dl/wine }

      - name: Fetch the Ubuntu base rootfs for amd64
        run: |
          set -euo pipefail
          base="https://cdimage.ubuntu.com/ubuntu-base/releases/${UBUNTU_RELEASE}/release"
          name=$(curl -fsSL "$base/" \
            | grep -o "ubuntu-base-${UBUNTU_RELEASE}[0-9.]*-base-amd64.tar.gz" \
            | sort -u | tail -1)
          test -n "$name" || { echo "::error::no amd64 base image at $base"; exit 1; }
          curl -fsSL -o base-amd64.tar.gz "$base/$name"
          curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
          grep " \*\?${name}\$" SHA256SUMS \
            | sed "s|[*]\?${name}|base-amd64.tar.gz|" | sha256sum -c -
          mkdir -p tree
          tar -xzf base-amd64.tar.gz -C tree

      # The base image does not carry Wine's runtime dependencies — ntdll.so
      # alone needs libunwind, which is not in it. Adding them one per device
      # test costs a 150 MB download each time, so pull the set in one go and
      # then verify nothing is left unresolved.
      - name: Add Wine's runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          mkdir -p debs && cd debs
          apt-get download -qq \
            libunwind8 libfreetype6 libfontconfig1 libpng16-16t64 libbrotli1 \
            libharfbuzz0b libglib2.0-0t64 libgraphite2-3 zlib1g libbz2-1.0 \
            libx11-6 libxext6 libxrandr2 libxi6 libxcursor1 libxinerama1 \
            libxcomposite1 libxfixes3 libxrender1 libxcb1 libxau6 libxdmcp6 \
            libgl1 libglx0 libglvnd0 libegl1 libgbm1 libdrm2 libvulkan1 \
            libasound2t64 libpulse0 libdbus-1-3 libsystemd0 libudev1 \
            libgnutls30t64 libp11-kit0 libtasn1-6 libnettle8t64 libhogweed6t64 \
            libgmp10 libidn2-0 libunistring5 libffi8 \
            libxml2 libxslt1.1 libicu74 liblzma5 \
            libusb-1.0-0 libkrb5-3 libk5crypto3 libcom-err2 libkrb5support0 \
            libkeyutils1 libssl3t64 libcups2t64 libpcap0.8t64 \
            libgcc-s1 libstdc++6 libmd0 libcap2 liblz4-1 libzstd1 \
            2>&1 | tail -3 || true
          cd ..
          for d in debs/*.deb; do dpkg -x "$d" tree; done
          echo "libunwind present:"; ls tree/usr/lib/x86_64-linux-gnu/libunwind* 2>/dev/null || echo "  MISSING"

      # Walk what Wine actually links against and fail here, with names, on
      # anything the tree cannot satisfy.
      - name: Verify Wine's dependencies resolve
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq binutils unzip
          mkdir -p winetree && unzip -q dl/wine/wine-x86_64.zip -d winetree

          # Every soname the tree or Wine itself provides.
          have=$( (find tree -name '*.so*' -printf '%f\n';
                   find winetree -name '*.so*' -printf '%f\n') | sort -u )

          missing=""
          while read -r lib; do
            case "$have" in *"$lib"*) ;; *) missing="$missing $lib" ;; esac
          done < <(
            find winetree -name '*.so' -o -type f -name 'wine*' \
              | while read -r f; do
                  readelf -d "$f" 2>/dev/null | awk -F'[][]' '/NEEDED/{print $2}'
                done | sort -u
          )

          if [ -n "$missing" ]; then
            echo "::error::Wine needs libraries the x86_64 tree lacks:$missing"
            exit 1
          fi
          echo "All of Wine's dependencies resolve."

      - name: Package
        run: |
          set -euo pipefail
          tar -czf rootfs-x86_64.tar.gz -C tree .
          ls -lh rootfs-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-base-amd64
          path: rootfs-x86_64.tar.gz
          if-no-files-found: error

  # PRoot intercepts syscalls so a glibc process survives Android's seccomp
  # filter. Measured on device: direct execution of rootfs binaries is killed
  # with SIGSYS under every environment tried, so this is not optional.
  #
  # Termux's build is used rather than our own: it is built against bionic,
  # is the build the whole ecosystem relies on for exactly this, and
  # rebuilding it would mean cross-compiling talloc as well for no gain.
  proot:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch proot and every library it needs
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq binutils
          base="https://packages.termux.dev/apt/termux-main"
          curl -fsSL "$base/dists/stable/main/binary-aarch64/Packages" -o Packages
          mkdir -p debs out payload/proot/bin payload/proot/lib

          fetch_pkg() {
            local pkg="$1"
            [ -f "debs/$pkg.deb" ] && return 0
            local path
            path=$(awk -v p="$pkg" '
              $1=="Package:" { cur=$2 }
              $1=="Filename:" && cur==p { print $2 }
            ' Packages | tail -1)
            if [ -z "$path" ]; then return 1; fi
            echo "  fetching $pkg"
            curl -fsSL "$base/$path" -o "debs/$pkg.deb"
            dpkg-deb -x "debs/$pkg.deb" out
          }

          # Which Termux package provides a given soname. Resolved from the
          # repository rather than hard-coded where the name makes it obvious.
          pkg_for_lib() {
            case "$1" in
              libtalloc.so*)        echo libtalloc ;;
              libandroid-shmem.so*) echo libandroid-shmem ;;
              libandroid-support*)  echo libandroid-support ;;
              libiconv.so*)         echo libiconv ;;
              libintl.so*)          echo libintl ;;
              *) echo "" ;;
            esac
          }

          # Provided by Android itself; never bundled.
          is_system_lib() {
            case "$1" in
              libc.so|libdl.so|libm.so|liblog.so|libstdc++.so|libz.so|\
              libandroid.so|libEGL.so|libGLESv2.so|libvulkan.so|ld-android.so)
                return 0 ;;
              *) return 1 ;;
            esac
          }

          fetch_pkg proot

          # Walk the dependency graph instead of discovering one missing
          # library per device test. Anything unresolved fails the build here.
          queue=("$(find out -type f -name proot | head -1)")
          seen=""
          missing=""
          while [ ${#queue[@]} -gt 0 ]; do
            item="${queue[0]}"; queue=("${queue[@]:1}")
            [ -f "$item" ] || continue
            for need in $(readelf -d "$item" 2>/dev/null \
                          | awk -F'[][]' '/NEEDED/ {print $2}'); do
              case " $seen " in *" $need "*) continue ;; esac
              seen="$seen $need"
              if is_system_lib "$need"; then
                echo "  $need: provided by Android"
                continue
              fi
              pkg=$(pkg_for_lib "$need")
              if [ -z "$pkg" ] || ! fetch_pkg "$pkg"; then
                missing="$missing $need"
                continue
              fi
              # Copy the real file, dereferenced: ZIP cannot carry symlinks
              # and the on-device extractor writes them as ordinary files.
              src=$(find out -name "$need" -o -name "$need.*" | head -1)
              if [ -z "$src" ]; then missing="$missing $need"; continue; fi
              real=$(readlink -f "$src")
              cp -L "$real" "payload/proot/lib/$need"
              test -s "payload/proot/lib/$need" || { echo "::error::$need is empty"; exit 1; }
              echo "  $need: bundled"
              queue+=("payload/proot/lib/$need")
            done
          done

          if [ -n "$missing" ]; then
            echo "::error::unresolved libraries:$missing"
            exit 1
          fi

          cp "$(find out -type f -name proot | head -1)" payload/proot/bin/
          # PRoot needs its loader helpers beside it.
          find out -type f \( -name 'loader' -o -name 'loader32' \) \
            -exec cp {} payload/proot/bin/ \; || true

          echo "--- payload:"; ls -lR payload/proot

      - name: Package
        run: |
          set -euo pipefail
          (cd payload && zip -qr ../proot-aarch64.zip proot)
          sha256sum proot-aarch64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: proot-aarch64
          path: proot-aarch64.zip
          if-no-files-found: error

  # Assembles the components into the single payload the app installs.
  payload:
    needs: [box64, rootfs, rootfs_x86, wine, proot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: box64-aarch64, path: dl/box64 }
      - uses: actions/download-artifact@v4
        with: { name: ubuntu-base-arm64, path: dl/rootfs }
      - uses: actions/download-artifact@v4
        with: { name: wine-x86_64, path: dl/wine }
      - uses: actions/download-artifact@v4
        with: { name: proot-aarch64, path: dl/proot }
      - uses: actions/download-artifact@v4
        with: { name: ubuntu-base-amd64, path: dl/rootfs_x86 }

      - name: Assemble
        run: |
          set -euo pipefail
          mkdir -p tree
          # The rootfs stays a tarball inside the payload and is unpacked on
          # the device. A Linux rootfs holds device nodes, sockets and
          # root-owned modes that ZIP cannot represent at all, so unpacking it
          # here would quietly lose them.
          cp dl/rootfs/rootfs.tar.gz tree/rootfs.tar.gz
          cp dl/rootfs_x86/rootfs-x86_64.tar.gz tree/rootfs-x86_64.tar.gz
          unzip -q dl/box64/box64-aarch64.zip -d tree
          unzip -q dl/wine/wine-x86_64.zip -d tree
          unzip -q dl/proot/proot-aarch64.zip -d tree
          printf '%s\n' \
            'rootfs_archive=rootfs.tar.gz' \
            'rootfs_x86_archive=rootfs-x86_64.tar.gz' \
            'box64=box64/bin/box64' \
            'wine=wine/bin/wine64' \
            'proot=proot/bin/proot' \
            'executable_dirs=box64/bin,wine/bin,proot/bin' > tree/MANIFEST
          du -sh tree/*

      - name: Package and checksum
        id: pack
        run: |
          set -euo pipefail
          (cd tree && zip -qr ../zovex-runtime.zip .)
          sum=$(sha256sum zovex-runtime.zip | cut -d' ' -f1)
          size=$(stat -c%s zovex-runtime.zip)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          ls -lh zovex-runtime.zip
          echo "SHA-256: $sum"

      # Published under a fixed tag so the app has one stable URL to fetch,
      # with the digest it must match printed in the release body.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-${{ github.run_number }}
          name: ZOVEX runtime ${{ github.run_number }}
          body: |
            Wine 9.0 (x86_64) + Box64 (aarch64) + Ubuntu 24.04 base (arm64)

            sha256: ${{ steps.pack.outputs.sha256 }}
            bytes:  ${{ steps.pack.outputs.size }}
          files: zovex-runtime.zip
          make_latest: false
