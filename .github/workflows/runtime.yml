name: Build runtime payload

# Heavy and slow, so it does not run on every push to the app. It runs when
# this workflow or the runtime manifest changes, and on demand.
on:
  push:
    paths:
      - ".github/workflows/runtime.yml"
      - "runtime/**"
  workflow_dispatch:

permissions:
  contents: write

env:
  BOX64_REF: v0.3.4
  UBUNTU_RELEASE: "24.04"
  WINE_REF: wine-9.0

jobs:
  box64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu cmake ninja-build python3

      - name: Fetch Box64
        run: |
          git clone --depth 1 --branch "$BOX64_REF" https://github.com/ptitSeb/box64.git box64-src
          echo "Box64 at $(git -C box64-src rev-parse HEAD)"

      # Built for aarch64 glibc, not for bionic: it runs inside the Linux
      # rootfs, where Wine's x86_64 binaries live. Upstream documents the
      # bionic build as experimental and unable to run Linux binaries, which
      # is exactly what we need it to do.
      - name: Configure and build
        run: |
          cmake -S box64-src -B box64-build -G Ninja \
            -DARM64=1 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++ \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64
          cmake --build box64-build --parallel

      - name: Check what came out
        run: |
          find box64-build -maxdepth 1 -type f -name 'box64*' -print
          file box64-build/box64
          # Must be an aarch64 ELF; anything else means the cross build
          # silently fell back to the host compiler.
          file box64-build/box64 | grep -q 'ARM aarch64' \
            || { echo "::error::box64 is not an aarch64 binary"; exit 1; }

      - name: Package
        run: |
          mkdir -p payload/box64/bin
          cp box64-build/box64 payload/box64/bin/
          cp box64-src/LICENSE payload/box64/ 2>/dev/null || true
          echo "$BOX64_REF" > payload/box64/VERSION
          (cd payload && zip -r ../box64-aarch64.zip box64)
          sha256sum box64-aarch64.zip | tee box64-aarch64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: box64-aarch64
          path: |
            box64-aarch64.zip
            box64-aarch64.zip.sha256
          if-no-files-found: error

  rootfs:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the Ubuntu base rootfs for arm64
        run: |
          base="https://cdimage.ubuntu.com/ubuntu-base/releases/${UBUNTU_RELEASE}/release"
          # The point release in the filename moves, so discover it rather
          # than pinning a name that silently 404s on the next respin.
          name=$(curl -fsSL "$base/" \
            | grep -o "ubuntu-base-${UBUNTU_RELEASE}[0-9.]*-base-arm64.tar.gz" \
            | sort -u | tail -1)
          test -n "$name" || { echo "::error::no arm64 base image found at $base"; exit 1; }
          echo "Using $name"
          curl -fsSL -o rootfs.tar.gz "$base/$name"
          curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
          grep " \*\?${name}\$" SHA256SUMS | sed "s|[*]\?${name}|rootfs.tar.gz|" | sha256sum -c -
          echo "ROOTFS_NAME=$name" >> "$GITHUB_ENV"

      - name: Report size
        run: |
          ls -lh rootfs.tar.gz
          tar -tzf rootfs.tar.gz | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-base-arm64
          path: rootfs.tar.gz
          if-no-files-found: error

  wine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc g++ flex bison make pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxinerama-dev libxcomposite-dev libxfixes-dev libxrender-dev \
            libfreetype-dev libfontconfig1-dev libgl-dev libegl-dev \
            libvulkan-dev libasound2-dev libpulse-dev libudev-dev \
            libsdl2-dev libgnutls28-dev libxml2-dev libxslt1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libusb-1.0-0-dev libkrb5-dev libcups2-dev libdbus-1-dev \
            ocl-icd-opencl-dev libpcap-dev libsane-dev

      - name: Fetch Wine
        run: |
          git clone --depth 1 --branch "$WINE_REF" https://gitlab.winehq.org/wine/wine.git wine-src
          echo "Wine at $(git -C wine-src rev-parse HEAD)"

      # Built for x86_64 Linux on an x86_64 runner: no cross-compilation.
      # On the phone this is what Box64 translates, which is the whole point
      # of the rootfs path.
      - name: Configure
        run: |
          mkdir wine-build
          cd wine-build
          ../wine-src/configure \
            --enable-win64 \
            --prefix=/opt/wine \
            --disable-tests \
            --without-oss \
            --with-x \
            --with-vulkan \
            --with-freetype
          # configure warns rather than fails on missing optional parts, so
          # surface them instead of discovering the gap on the device.
          grep -A40 'you can still compile' config.log || true

      - name: Build
        run: make -C wine-build -j"$(nproc)"

      - name: Install into a staging tree
        run: |
          make -C wine-build install DESTDIR="$PWD/stage"
          du -sh stage/opt/wine
          file stage/opt/wine/bin/wine64 || file stage/opt/wine/bin/wine

      - name: Package
        run: |
          cp wine-src/LICENSE stage/opt/wine/ 2>/dev/null || true
          echo "$WINE_REF" > stage/opt/wine/VERSION
          (cd stage/opt && zip -qr "$GITHUB_WORKSPACE/wine-x86_64.zip" wine)
          sha256sum wine-x86_64.zip | tee wine-x86_64.zip.sha256
          ls -lh wine-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: wine-x86_64
          path: |
            wine-x86_64.zip
            wine-x86_64.zip.sha256
          if-no-files-found: error

  # Assembles the three components into the single payload the app installs.
  payload:
    needs: [box64, rootfs, wine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: box64-aarch64, path: dl/box64 }
      - uses: actions/download-artifact@v4
        with: { name: ubuntu-base-arm64, path: dl/rootfs }
      - uses: actions/download-artifact@v4
        with: { name: wine-x86_64, path: dl/wine }

      - name: Assemble
        run: |
          set -euo pipefail
          mkdir -p tree
          # The rootfs is the base; Box64 and Wine are laid into it at the
          # paths the launcher will reference.
          mkdir -p tree/rootfs
          tar -xzf dl/rootfs/rootfs.tar.gz -C tree/rootfs
          unzip -q dl/box64/box64-aarch64.zip -d tree
          unzip -q dl/wine/wine-x86_64.zip -d tree
          # ZIP drops permission bits, so the launcher restores them; record
          # which trees hold binaries so it knows where to look.
          cat > tree/MANIFEST <<'META'
          rootfs=rootfs
          box64=box64/bin/box64
          wine=wine/bin/wine64
          executable_dirs=box64/bin,wine/bin,rootfs/bin,rootfs/usr/bin,rootfs/sbin,rootfs/usr/sbin
          META
          du -sh tree/*

      - name: Package and checksum
        id: pack
        run: |
          set -euo pipefail
          (cd tree && zip -qr ../zovex-runtime.zip .)
          sum=$(sha256sum zovex-runtime.zip | cut -d' ' -f1)
          size=$(stat -c%s zovex-runtime.zip)
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          ls -lh zovex-runtime.zip
          echo "SHA-256: $sum"

      # Published under a fixed tag so the app has one stable URL to fetch,
      # with the digest it must match printed in the release body.
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runtime-${{ github.run_number }}
          name: ZOVEX runtime ${{ github.run_number }}
          body: |
            Wine 9.0 (x86_64) + Box64 (aarch64) + Ubuntu 24.04 base (arm64)

            sha256: ${{ steps.pack.outputs.sha256 }}
            bytes:  ${{ steps.pack.outputs.size }}
          files: zovex-runtime.zip
          make_latest: false
